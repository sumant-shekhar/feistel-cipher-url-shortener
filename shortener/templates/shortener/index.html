<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feistel Cipher URL Shortener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    label, input, button {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
    }
    input {
      padding: 0.75rem;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .result {
      margin-top: 1rem;
      padding: 1rem;
      background: #f7f7f7;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Feistel Cipher URL Shortener</h1>
    <p>Enter a long URL to generate a short code using the Feistel cipher + Base62 flow.</p>

    <form method="post" action="{% url 'shorten' %}">
      {% csrf_token %}
      <label for="long_url">Long URL</label>
      <input id="long_url" name="long_url" type="url" placeholder="https://example.com" required>
      <button type="submit">Shorten URL</button>
    </form>

    <div class="result">
      <p>After submission, the API response will contain the generated short code.</p>
      <p>Use the short code in the browser as <code>/{short_code}</code> to redirect.</p>
    </div>
  </div>
</body>
</html>
